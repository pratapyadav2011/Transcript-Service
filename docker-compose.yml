services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Never publish Redis publicly: it has no password, and open Redis ports are
    # scanned and exploited (CONFIG SET dir + SAVE / MODULE LOAD) within hours.
    # App containers reach it on the internal network as redis://redis:6379.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.core.celery_app worker --loglevel=info --queues=celery --concurrency=${WORKER_CONCURRENCY:-4}
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  whisper-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OMP_NUM_THREADS: ${WHISPER_CPU_THREADS:-3}
    command: celery -A app.core.celery_app worker --loglevel=info --queues=whisper --concurrency=1
    # Cap RAM so an over-long-audio transcription is killed cleanly instead of
    # thrashing/OOM-killing other services on the host. The delivery cap in the
    # app then fails the job rather than looping. Size this to the host's memory.
    mem_limit: ${WHISPER_MEM_LIMIT:-5g}
    mem_reservation: ${WHISPER_MEM_RESERVATION:-3g}
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - whisper-models:/models/whisper

  flower:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.core.celery_app flower --port=5555
    # Flower has no auth and can revoke tasks / shut down workers — local only.
    # Reach it with: ssh -L 5555:localhost:5555 <vm>
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis

  # Comment toxicity scorer (toxicity/README.md). A drop-in for the Hugging Face
  # Inference API endpoint for unitary/unbiased-toxic-roberta. Separate image:
  # it needs torch, which the transcript image doesn't.
  toxicity:
    build: ./toxicity
    image: transcript-service-toxicity:latest
    restart: unless-stopped
    environment:
      SERVICE_TOKEN: ${TOXICITY_SERVICE_TOKEN:?set TOXICITY_SERVICE_TOKEN in .env (openssl rand -hex 32)}
      # Keep torch's thread count equal to the CPU allocation below.
      TORCH_THREADS: ${TOXICITY_CPUS:-2}
      # Each check (including the comment text) is kept this long for the
      # /toxicity page in the transcript UI.
      REDIS_URL: redis://redis:6379/0
      HISTORY_DAYS: ${TOXICITY_HISTORY_DAYS:-7}
    depends_on:
      - redis
    cpus: ${TOXICITY_CPUS:-2}
    mem_limit: 2g
    # Internal only: reached through Caddy (docker-compose.caddy.yml). Never
    # add a "ports:" entry -- Docker-published ports bypass ufw.
    expose:
      - "8000"

  # Optional: VM end of the home residential proxy (home-proxy/ runs the other
  # end on your home machine). Cloudflare TCP tunnels need this client on the
  # calling side; it exposes the tunnel as a plain proxy at cf-proxy:8888.
  # Only starts with COMPOSE_PROFILES=home-proxy in .env.
  cf-proxy:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["home-proxy"]
    command: >
      access tcp --hostname ${CF_PROXY_HOSTNAME:-}
      --url 0.0.0.0:8888
      --service-token-id ${CF_ACCESS_CLIENT_ID:-}
      --service-token-secret ${CF_ACCESS_CLIENT_SECRET:-}

volumes:
  redis-data:
  whisper-models:
