<!doctype html>
<meta charset="utf-8" />
<title>Send YouTube cookies</title>
<style>
  body { width: 290px; margin: 0; padding: 14px; background: #0f1220; color: #e6e9f2;
         font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; color: #9aa3bd; font-size: 12px; margin-bottom: 9px; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 9px;
          background: #232a44; border: 1px solid #2c3350; border-radius: 7px; color: #e6e9f2; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 7px; background: #4f7cff;
           color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 10px; padding: 8px 10px; border-radius: 7px; font-size: 12px; display: none; }
  .ok { display: block !important; background: rgba(46,204,113,.12); color: #2ecc71; }
  .err { display: block !important; background: rgba(255,92,92,.12); color: #ff5c5c; }
  .hint { color: #9aa3bd; font-size: 11px; margin: 10px 0 0; }
  .warn { margin: 0 0 9px; padding: 8px 10px; border-radius: 7px; font-size: 12px;
          background: rgba(245,166,35,.12); color: #f5a623; }
  #checking { color: #9aa3bd; font-size: 12px; }
</style>
<h1>Send YouTube cookies</h1>
<label>Transcript service URL
  <input id="url" type="url" placeholder="https://transcripts.example.com" />
</label>
<div id="signin" hidden>
  <p class="warn">Not signed in to YouTube in this browser.</p>
  <button id="login">Log in to YouTube</button>
</div>
<button id="send" hidden>Send cookies</button>
<div id="checking">Checking YouTube sign-in…</div>
<div id="status"></div>
<p class="hint">Settings are saved locally. Log in to YouTube first, then click Send.</p>
<script src="config.js"></script>
<script src="popup.js"></script>
